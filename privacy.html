  const d = PRIVACY[l] || PRIVACY.en;
  document.getElementById('priv-title').textContent = T('n_privacy') || 'Privacy';
  document.getElementById('priv-meta').textContent = d.meta;
  document.getElementById('priv-lead').textContent = d.lead;
  document.getElementById('priv-body').innerHTML = d.secs.map(
    s => `<section class="priv-sec"><h2>${s[0]}</h2><p>${s[1]}</p></section>`
  ).join('');
}

renderPrivacy();
document.addEventListener('aw:langchange', renderPrivacy);
